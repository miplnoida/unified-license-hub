name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: |
          bunx tsc --noEmit -p tsconfig.app.json
          bunx tsc --noEmit -p tsconfig.node.json
          bunx tsc --noEmit -p tsconfig.aml-e2e.json
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
      - name: Frontend tests
        run: bun run test

  rbac-oracles:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      - name: RBAC parity oracle (UI + scope, hard gate, no drift allowed)
        run: node scripts/verify-rbac-parity.mjs

      - name: RBAC namespace canonicalization (no legacy aliases)
        run: node scripts/verify-no-alias-namespaces.mjs

      - name: RBAC authorization centralization (no ad-hoc permission scans)
        run: node scripts/verify-authz-centralized.mjs

      - name: RBAC atomic authz (no unallowlisted check-then-mutate)
        run: node scripts/verify-atomic-authz.mjs

      - name: Navigation icons approved and non-placeholder
        run: node scripts/validate-nav-icons.mjs



      - name: RBAC catalog fully enforced (enforced:false must be 0)
        run: |
          set -euo pipefail
          count=$(node -e "console.log(Object.values(require('./src/lib/rbac/catalog.json')).flatMap(m => Object.values(m)).filter(v => v && v.enforced === false).length)")
          echo "enforced:false count = $count"
          [ "$count" -eq 0 ]

      - name: RBAC catalogue integrity (no invalid refs, all orphans dispositioned)
        run: bunx vitest run src/test/rbac/catalogueIntegrity.test.ts

      - name: RBAC disposition register is up to date
        run: |
          set -euo pipefail
          bunx tsx scripts/generate-permission-disposition.ts
          git diff --exit-code -- docs/rbac/permission-disposition.json docs/rbac/permission-disposition.md

      - name: Authorize service unit tests
        run: bunx vitest run src/test/authorize.test.ts

      - name: Sensitive privilege proofs
        run: bunx vitest run src/test/sensitivePrivilegeProofs.test.ts

      - name: Persona matrix (7 personas)
        run: bunx vitest run src/test/personaMatrix.test.ts

      - name: Role validation & scope capability tests
        run: bunx vitest run src/test/roleValidation.test.ts src/test/accessLevels.test.ts

      - name: Route/menu coverage
        run: bunx vitest run src/test/routeCoverage.test.ts src/test/sidebarVisibility.test.tsx src/test/adminNavGates.test.ts

      - name: RBAC test suite (permissions + persona + guards)
        run: bunx vitest run src/test/permissionsRbac.test.tsx

      - name: Notification preference tests
        run: bunx vitest run src/test/notificationPreferences.test.ts


      - name: Assert required RBAC pgTAP files exist
        run: |
          set -euo pipefail
          required=(
            supabase/tests/rbac/00_helpers.sql
            supabase/tests/rbac/160_slice_b_scoped_permission.sql
            supabase/tests/rbac/200_multi_role_scope.sql
            supabase/tests/rbac/210_assigned_scope.sql
            supabase/tests/rbac/220_phase3_complaints_conduct.sql
            supabase/tests/rbac/230_phase4_selector_validation.sql
            supabase/tests/rbac/240_phase5_atomic_and_deps.sql
            supabase/tests/rbac/250_phase6_sensitive_privileges.sql
            supabase/tests/rbac/260_no_alias_namespaces.sql
            supabase/tests/rbac/270_enforce_permission_helpers.sql
            supabase/tests/rbac/271_application_rpcs_gated.sql
            supabase/tests/rbac/272_export_and_escalate_gated.sql
            supabase/tests/rbac/273_returns_reject_gated.sql
            supabase/tests/rbac/274_enforce_action_gate.sql
            supabase/tests/rbac/275_role_management_gates.sql
            supabase/tests/rbac/276_form_management_gates.sql
            supabase/tests/rbac/277_batch8_gates.sql
            supabase/tests/rbac/283_custom_role_noop.sql
            supabase/tests/rbac/284_custom_role_full_regression.sql
            supabase/tests/rbac/290_workflow_guard.sql
          )
          missing=0
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::Required RBAC pgTAP file missing: $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

  rule-engine:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      - name: Runtime ownership oracle (one runtime owner per rule family)
        run: node scripts/verify-runtime-ownership.mjs

      - name: Rule tester + runtime ownership tests
        run: bunx vitest run src/test/ruleTester.test.ts src/test/ruleEngineRuntimeOwnership.test.ts

      - name: Assert rule-engine evidence artefacts exist
        run: |
          set -euo pipefail
          missing=0
          for f in \
            docs/rule-engine/runtime-ownership.json \
            docs/rule-engine/overlap-matrix.md \
            supabase/tests/rule_engine/300_runtime_governance.sql \
            supabase/tests/rule_engine/330_tester_parity.sql; do
            if [ ! -f "$f" ]; then
              echo "::error::Required rule-engine artefact missing: $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

  db-tests:

    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Supabase
        run: supabase start
      - name: Reset database (applies all migrations)
        run: supabase db reset --no-seed
      - name: Assert required notification pgTAP files exist
        run: |
          set -euo pipefail
          missing=0
          for f in \
            supabase/tests/notifications/01_model.sql \
            supabase/tests/notifications/02_rls.sql \
            supabase/tests/notifications/03_preferences.sql \
            supabase/tests/notifications/04_delivery_audit.sql \
            supabase/tests/notifications/05_read_audit.sql \
            supabase/tests/notifications/06_centre_rpcs.sql \
            supabase/tests/notifications/07_preferences_matrix.sql \
            supabase/tests/notifications/08_digest.sql; do
            if [ ! -f "$f" ]; then
              echo "::error::Required notification pgTAP file missing: $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Assert required Phase 3 (Fit & Proper) pgTAP files exist
        run: |
          set -euo pipefail
          missing=0
          for f in \
            supabase/tests/phase3/01_registry.sql \
            supabase/tests/phase3/02_pq.sql \
            supabase/tests/phase3/03_screening.sql \
            supabase/tests/phase3/04_assessment.sql \
            supabase/tests/phase3/05_committee.sql \
            supabase/tests/phase3/06_twin_peaks.sql \
            supabase/tests/phase3/07_conditions.sql \
            supabase/tests/phase3/08_rls_matrix.sql \
            docs/verification/fit-and-proper/phase3-manual-verification.md; do
            if [ ! -f "$f" ]; then
              echo "::error::Required Phase 3 artefact missing: $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Assert required Phase 8 (Market Surveillance) pgTAP files exist
        run: |
          set -euo pipefail
          missing=0
          for f in \
            supabase/tests/phase8/01_market_surveillance.sql \
            supabase/tests/phase8/02_referral.sql \
            supabase/tests/phase8/03_rule_versions.sql \
            supabase/tests/phase8/04_rls_personas.sql \
            docs/verification/phase8/manual-verification.md; do
            if [ ! -f "$f" ]; then
              echo "::error::Required Phase 8 artefact missing: $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Assert required Phase 9 (Communication Registry) pgTAP files exist
        run: |
          set -euo pipefail
          missing=0
          for f in \
            supabase/tests/notifications/10_communication_registry.sql \
            supabase/tests/phase9/01_communication_lifecycle.sql \
            supabase/tests/phase9/02_timeline_rls_personas.sql \
            docs/verification/phase9/manual-verification.md; do
            if [ ! -f "$f" ]; then
              echo "::error::Required Phase 9 artefact missing: $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Assert required Phase 10 (Lineage & Export Governance) pgTAP files exist
        run: |
          set -euo pipefail
          missing=0
          for f in \
            supabase/tests/phase10/01_record_lineage.sql \
            supabase/tests/phase10/02_export_governance.sql \
            docs/verification/phase10/manual-verification.md; do
            if [ ! -f "$f" ]; then
              echo "::error::Required Phase 10 artefact missing: $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Assert required Phase 11 (Dashboards & Governed Reporting) pgTAP files exist
        run: |
          set -euo pipefail
          missing=0
          for f in \
            supabase/tests/phase11/01_prudential_sector_risk.sql \
            supabase/tests/phase11/02_kpi_reconciliation.sql \
            docs/verification/phase11/manual-verification.md; do
            if [ ! -f "$f" ]; then
              echo "::error::Required Phase 11 artefact missing: $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Assert required Phase 12 (FRD revalidation) artefacts exist
        run: |
          set -euo pipefail
          missing=0
          for f in \
            docs/frd/TRACEABILITY.csv \
            docs/verification/phase12/frd-revalidation.md \
            scripts/verify-traceability.mjs; do
            if [ ! -f "$f" ]; then
              echo "::error::Required Phase 12 artefact missing: $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: FRD traceability gate (every Done requirement must cite a real artefact)
        run: node scripts/verify-traceability.mjs


      - name: Run pgTAP suite (complaints + RBAC + notifications + phases 1-11)
        run: supabase test db



      - name: Assert required edge-function tests exist
        run: |
          set -euo pipefail
          missing=0
          for f in \
            supabase/functions/complaint-escalation-sweep/index_test.ts \
            supabase/functions/complaint-storage-cleanup/index_test.ts \
            supabase/functions/tests/integration_governance_test.ts \
            supabase/functions/tests/integration_retry_queue_test.ts; do
            if [ ! -f "$f" ]; then
              echo "::error::Required edge-function test missing: $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Assert Integration Manager evidence artefacts exist
        run: |
          set -euo pipefail
          missing=0
          for f in \
            supabase/tests/integrations/400_retry_queue.sql \
            docs/verification/integrations/03_invocation_service.md \
            docs/verification/integrations/04_retry_queue.md \
            docs/verification/integrations/05_dead_letter_queue.md; do
            if [ ! -f "$f" ]; then
              echo "::error::Required integration artefact missing: $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Assert required Phase 1 pgTAP files exist
        run: |
          set -euo pipefail
          missing=0
          for f in \
            supabase/tests/phase1/01_sla_runtime.sql \
            supabase/tests/phase1/02_decision_gates_artifacts.sql \
            supabase/tests/phase1/03_audit_appendonly.sql \
            supabase/functions/tests/phase1_decision_gate_test.ts; do
            if [ ! -f "$f" ]; then
              echo "::error::Required Phase 1 pgTAP file missing: $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Assert required Phase 2 pgTAP files exist
        run: |
          set -euo pipefail
          missing=0
          for f in \
            supabase/tests/phase2/01_ratio_engine.sql \
            supabase/tests/phase2/02_peer_comparison.sql \
            supabase/tests/phase2/03_ewi_engine.sql \
            supabase/tests/phase2/04_camels_lifecycle.sql \
            supabase/tests/phase2/05_group_consolidation.sql \
            supabase/tests/phase2/06_rls_persona_matrix.sql; do
            if [ ! -f "$f" ]; then
              echo "::error::Required Phase 2 pgTAP file missing: $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]





      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Phase 1 decision-gate end-to-end test (LIC-DEC-001)
        run: |
          set -euo pipefail
          eval "$(supabase status -o env | sed \
            -e 's/^API_URL=/SUPABASE_URL=/' \
            -e 's/^ANON_KEY=/SUPABASE_ANON_KEY=/' \
            -e 's/^SERVICE_ROLE_KEY=/SUPABASE_SERVICE_ROLE_KEY=/')"
          export SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY
          export PHASE1_E2E=1
          deno test --allow-net --allow-env --allow-read \
            supabase/functions/tests/phase1_decision_gate_test.ts


      - name: Edge Function tests
        run: deno test --allow-net --allow-env --allow-read supabase/functions/


  aml-authorization-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: AML authorization evidence regression
        run: node --test scripts/aml/authorization-evidence.test.mjs
