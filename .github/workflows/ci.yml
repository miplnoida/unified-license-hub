name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsgo --noEmit
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
      - name: Frontend tests
        run: bun run test

  db-tests:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Supabase
        run: supabase start
      - name: Reset database (applies all migrations)
        run: supabase db reset --no-seed
      - name: Run complaints pgTAP suite
        run: supabase test db

      - name: Assert required edge-function tests exist
        run: |
          set -euo pipefail
          missing=0
          for f in \
            supabase/functions/complaint-escalation-sweep/index_test.ts \
            supabase/functions/complaint-storage-cleanup/index_test.ts; do
            if [ ! -f "$f" ]; then
              echo "::error::Required edge-function test missing: $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Edge Function tests
        run: deno test --allow-net --allow-env supabase/functions/
