name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsgo --noEmit
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
      - name: Frontend tests
        run: bun run test

  db-tests:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Supabase
        run: supabase start
      - name: Reset database (applies all migrations)
        run: supabase db reset --no-seed
      - name: Run complaints pgTAP suite
        run: supabase test db
      - name: Edge Function tests
        run: |
          if compgen -G "supabase/functions/**/*_test.ts" > /dev/null || \
             compgen -G "supabase/functions/**/*.test.ts" > /dev/null; then
            deno test --allow-net --allow-env supabase/functions/
          else
            echo "No edge-function tests found; skipping."
          fi
